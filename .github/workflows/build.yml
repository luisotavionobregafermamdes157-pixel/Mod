name: Build AutoTool JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fabric Loom 1.18.x runs on Java 25. The mod itself is still
      # compiled with --release 21 for Minecraft 1.21.11 compatibility.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build mod
        run: gradle clean build

      - name: Verify remapped mod JAR
        run: |
          test -f build/libs/autotool-fabric-1.0.0.jar
          jar tf build/libs/autotool-fabric-1.0.0.jar | grep -E 'fabric.mod.json|dev/autotool/AutoToolClient.class'

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoTool-Fabric-1.21.11
          path: build/libs/autotool-fabric-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
